[package]
name = "aissence"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "aissence"

[features]
default = ["ner-redaction"]
ner-redaction = ["dep:redact-ner"]

[lib]
name = "aissence"
path = "src/lib.rs"

# CLI demo (text output).
[[bin]]
name = "aissence"
path = "src/main.rs"

# The egui desktop app (3-pane commit / message / diff browser).
[[bin]]
name = "aissence-gui"
path = "src/bin/gui.rs"

# Run a complete model benchmark and write side-by-side cache/stat files.
[[bin]]
name = "aissence-benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
# Unified parsing of Claude Code / Codex / Gemini session logs into one model.
# OpenCode is normalized into that model by the app's SQLite/JSON loader.
normalize-chat-sessions = "0.3.2"
# Pure-Rust git access. Pinned to ^0.81 to unify with normalize-chat-sessions'
# own gix dependency (avoids compiling two different gix versions).
gix = "0.81"
# Immediate-mode GUI. 0.34 to match egui-elegance ^0.34.
egui = "0.34"
# Native window shell for the app + examples.
eframe = "0.34"
# Opinionated egui widgets + paired dark/light themes.
egui-elegance = "0.13"
# Native folder-picker dialog (used when no --folder is given).
rfd = "0.15"
# Syntax highlighting backend. `default-fancy` selects the pure-Rust fancy-regex
# engine (no Oniguruma/C dependency). The scope→color theme mapping is vendored
# from VikerKit (MIT). See `src/highlight/`.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Timestamp parsing/comparison shared between git commit times and chat messages.
# `serde` feature: serialize message timestamps into the `.aissence` cache.
chrono.workspace = true
thiserror.workspace = true
# Serialize cached summaries (the `.aissence` file) + inspect tool-call inputs
# (the `ncs::ContentBlock::ToolUse` payload is a serde_json::Value).
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
# OpenCode stores current sessions in a SQLite database. `bundled` keeps the
# desktop app independent of a system SQLite installation.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# LLM summarization of conversations + code changes via OpenRouter.
openrouter-rs = "0.10"
# Async runtime + concurrency for the (async) summarization layer.
tokio.workspace = true
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
uuid.workspace = true
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
open = "5"
keyring = "3"
redact-core = "0.8.3"
redact-ner = { version = "0.8.3", optional = true }
regex = "1"
dotenvy = "0.15"
terminal_size = "0.4"
unicode-width = "0.2"
